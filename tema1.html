<!DOCTYPE html>
<!-- saved from url=(0038)https://amiuddd.github.io/oye-.4m1ud./ -->
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llueve Amor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
    
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      cursor: default;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      font-family: 'Courier New', monospace; /* ESTILO AÑADIDO */
    }

    .center-message {
      font-family: 'Courier New', monospace;
      color: #ff69b4;
      font-size: 3rem;
      text-align: center;
      opacity: 0.9; /* Cambiado de 0.1 a 0.5 para mayor visibilidad */
    }
  </style>
</head>
<body>

  <canvas id="canvas" width="1920" height="953"></canvas>

  <div class="overlay">
    <div class="center-message">TE AMO ZAMHIRA❤️</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Configurar tamaño del canvas
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const text = "TE AMO ZAMHIRA";
    const fontSize = 16;
    const columns = Math.floor(canvas.width / (fontSize * 4)); // Menos columnas porque "TE AMO" es más ancho
    const drops = new Array(columns).fill(1);

    ctx.font = fontSize + "px monospace";

    function draw() {
      // Fondo translúcido para efecto de desvanecimiento
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ff69b4"; // Rosado amoroso
      for (let i = 0; i < drops.length; i++) {
        const x = i * fontSize * 4;
        const y = drops[i] * fontSize;
        ctx.fillText(text, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(draw, 50);

    // Redimensionar canvas si cambia el tamaño
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>


</body></html>
