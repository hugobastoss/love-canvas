<!DOCTYPE html>
<!-- saved from url=(0038)https://amiuddd.github.io/oye-.4m1ud./ -->
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llueve Amor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
    
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      cursor: default;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      font-family: 'Courier New', monospace; /* ESTILO AÑADIDO */
    }

    .center-message {
      font-family: 'Courier New', monospace;
      /* Cor fixa e sempre legível sobre o fundo preto, independente da cor da chuva escolhida */
      color: #ffe6f5;
      font-size: clamp(1.75rem, 6vw, 3rem);
      text-align: center;
      padding-inline: 1rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <canvas id="canvas" width="1920" height="953"></canvas>

  <div class="overlay">
    <div class="center-message">TE AMO ZAMHIRA❤️</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const text = "TE AMO ZAMHIRA";
    const fontSize = 16;
    const rainColor = '#ff69b4';

    let cssW, cssH, drops;

    // Ajusta o buffer do canvas ao devicePixelRatio para não ficar borrado em telas retina
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      cssW = window.innerWidth;
      cssH = window.innerHeight;
      canvas.width = cssW * dpr;
      canvas.height = cssH * dpr;
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.font = fontSize + "px monospace";
      const columns = Math.floor(cssW / (fontSize * 4)); // Menos columnas porque "TE AMO" es más ancho
      drops = new Array(columns).fill(1);
    }
    resizeCanvas();

    function draw() {
      // Fondo translúcido para efecto de desvanecimiento
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, cssW, cssH);

      ctx.fillStyle = rainColor;
      for (let i = 0; i < drops.length; i++) {
        const x = i * fontSize * 4;
        const y = drops[i] * fontSize;
        ctx.fillText(text, x, y);

        if (y > cssH && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(draw, 50);

    // Redimensionar canvas se a tela mudar de tamanho (inclui rotação do celular)
    window.addEventListener('resize', resizeCanvas);
  </script>


</body></html>
