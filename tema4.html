<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galáxia do Amor</title>
  <style>
    body { margin: 0; background: #00000a; overflow: hidden; cursor: default; }
    canvas { position: absolute; top: 0; left: 0; }
    .overlay {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      z-index: 2; pointer-events: none;
    }
    .message {
      font-family: 'Courier New', monospace;
      color: #e8d8ff;
      font-size: 2.4rem;
      text-align: center;
      line-height: 1.4;
      animation: glow 3s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 15px #9c27b0, 0 0 30px #9c27b0; }
      50%       { text-shadow: 0 0 25px #e91e8c, 0 0 55px #e91e8c, 0 0 80px #e91e8c; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="overlay">
    <div class="message">Você é minha galáxia 🌌</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;

    const starColor   = '#c8b4ff';
    const nebulaColor = '#6400aa';

    function hexToRgb(hex) {
      return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
    }
    const [sr, sg, sb] = hexToRgb(starColor);
    const [nr, ng, nb] = hexToRgb(nebulaColor);

    /* ── STARS ── */
    const stars = Array.from({ length: 220 }, () => ({
      x:     Math.random() * canvas.width,
      y:     Math.random() * canvas.height,
      r:     Math.random() * 1.8 + 0.3,
      alpha: Math.random(),
      dir:   Math.random() > 0.5 ? 1 : -1,
      speed: Math.random() * 0.012 + 0.004
    }));

    /* ── SHOOTING STARS ── */
    const shoots = [];
    function spawnShoot() {
      shoots.push({
        x:     Math.random() * canvas.width,
        y:     Math.random() * canvas.height * 0.55,
        len:   Math.random() * 90 + 40,
        speed: Math.random() * 9 + 5,
        alpha: 1,
        angle: Math.PI / 4 + (Math.random() - 0.5) * 0.4
      });
    }
    setInterval(spawnShoot, 2800);

    /* ── NEBULA ── */
    function drawNebula() {
      const g1 = ctx.createRadialGradient(
        canvas.width * 0.32, canvas.height * 0.38, 15,
        canvas.width * 0.32, canvas.height * 0.38, canvas.width * 0.58
      );
      g1.addColorStop(0, `rgba(${nr},${ng},${nb},0.22)`);
      g1.addColorStop(0.5, `rgba(0,30,${nb},0.09)`);
      g1.addColorStop(1, 'transparent');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const g2 = ctx.createRadialGradient(
        canvas.width * 0.72, canvas.height * 0.62, 10,
        canvas.width * 0.72, canvas.height * 0.62, canvas.width * 0.42
      );
      g2.addColorStop(0, `rgba(${sr},${Math.floor(sg*0.2)},${sb},0.12)`);
      g2.addColorStop(1, 'transparent');
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    /* ── ANIMATE ── */
    function animate() {
      ctx.fillStyle = 'rgba(0,0,10,0.13)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      /* twinkling stars */
      stars.forEach(s => {
        s.alpha += s.speed * s.dir;
        if (s.alpha >= 1) { s.alpha = 1; s.dir = -1; }
        if (s.alpha <= 0) { s.alpha = 0; s.dir =  1; }
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${sr},${sg},${sb},${s.alpha})`;
        ctx.fill();
      });

      /* shooting stars */
      for (let i = shoots.length - 1; i >= 0; i--) {
        const s = shoots[i];
        s.x += Math.cos(s.angle) * s.speed;
        s.y += Math.sin(s.angle) * s.speed;
        s.alpha -= 0.017;
        const grd = ctx.createLinearGradient(
          s.x, s.y,
          s.x - Math.cos(s.angle) * s.len,
          s.y - Math.sin(s.angle) * s.len
        );
        grd.addColorStop(0, `rgba(255,255,255,${s.alpha})`);
        grd.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.beginPath();
        ctx.strokeStyle = grd;
        ctx.lineWidth = 1.5;
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - Math.cos(s.angle) * s.len, s.y - Math.sin(s.angle) * s.len);
        ctx.stroke();
        if (s.alpha <= 0) shoots.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }

    /* init */
    ctx.fillStyle = '#00000a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawNebula();
    animate();

    window.addEventListener('resize', () => {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      ctx.fillStyle = '#00000a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawNebula();
    });
  </script>
</body>
</html>
