<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estrelas do Amor</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
    }

    .message {
      font-family: 'Courier New', monospace;
      color: #ffd700;
      font-size: 2rem;
      text-align: center;
      opacity: 0.95;
      position: relative;
      transition: transform 0.1s ease;
      pointer-events: auto;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="overlay">
    <div class="message" id="love-message">Você é minha estrela ⭐</div>
  </div>

  <audio id="click-sound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_145ae7e783.mp3?filename=button-click-124467.mp3"></audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const lovePhrases = [
      "Você é minha luz ✨",
      "Meu universo é você 🌌",
      "Te amo além das estrelas 💫",
      "Zamhira, meu amor eterno ❤️",
      "Meu céu tem nome: Zamhira 💖",
      "Brilhamos juntos nessa galáxia 💑"
    ];

    const message = document.getElementById("love-message");
    const clickSound = document.getElementById("click-sound");

    function randomPhrase() {
      return lovePhrases[Math.floor(Math.random() * lovePhrases.length)];
    }

    // Estrelas caindo
    class Star {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.speed = 2 + Math.random() * 4;
        this.text = randomPhrase();
        this.alpha = 1;
      }

      update() {
        this.y += this.speed;
        this.alpha -= 0.002;
        if (this.y > canvas.height || this.alpha <= 0) {
          this.reset();
        }
      }

      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.font = "16px monospace";
        ctx.fillText(this.text, this.x, this.y);
      }
    }

    const stars = Array.from({ length: 20 }, () => new Star());

    function animate() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      stars.forEach(star => {
        star.update();
        star.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Central message interactions
    function changeCenterMessage() {
      clickSound.currentTime = 0;
      clickSound.play();
      message.textContent = randomPhrase();
    }

    // Clique e toque
    message.addEventListener("click", changeCenterMessage);
    message.addEventListener("touchstart", (e) => {
      e.preventDefault();
      changeCenterMessage();
    });

    // Movimento sutil com o dedo ou mouse
    function moveMessage(x, y) {
      const offsetX = (x - window.innerWidth / 2) / 50;
      const offsetY = (y - window.innerHeight / 2) / 50;
      message.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    }

    document.addEventListener("mousemove", e => moveMessage(e.clientX, e.clientY));
    document.addEventListener("touchmove", e => {
      const touch = e.touches[0];
      moveMessage(touch.clientX, touch.clientY);
    }, { passive: true });
  </script>
</body>
</html>
